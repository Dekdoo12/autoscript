# Bot Telegram untuk backup & restore.
# JANGAN menaruh BOT_TOKEN / CHAT_ID di file ini: repo ini bisa dibaca publik.
# Isi di tiap VPS melalui /etc/kyt/secrets.conf (BACKUP_BOT_TOKEN, BACKUP_CHAT_ID);
# installer akan menulis /etc/bot/backupbot.conf (chmod 600) yang dibaca menu backup/restore.
# (Menu backup/restore otomatis memakai salinan lokal itu bila file ini tidak memuat BOT_TOKEN.)
